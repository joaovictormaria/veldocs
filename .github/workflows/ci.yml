# CI do VELDOCS: bloqueia a entrega (Railway espera este workflow) quando
# lint, tipos, testes, build ou E2E falham.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos, testes, build e E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veldocs
          POSTGRES_PASSWORD: veldocs_ci_only
          POSTGRES_DB: veldocs_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veldocs -d veldocs_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Credenciais e chaves descartáveis, exclusivas do CI (não são secrets e
    # nunca devem ser usadas em outro ambiente).
    env:
      APP_ENV: development
      APP_URL: http://localhost:3000
      LOG_LEVEL: warn
      DATABASE_URL: postgresql://veldocs:veldocs_ci_only@localhost:5432/veldocs_ci
      TEST_DATABASE_URL: postgresql://veldocs:veldocs_ci_only@localhost:5432/veldocs_test
      APP_ENCRYPTION_KEY: Y2ktb25seS1lbmNyeXB0aW9uLWtleS0zMmJ5dGVzISE=
      APP_HMAC_KEY: Y2ktb25seS1obWFjLWtleS1ub3QtYS1zZWNyZXQtIyMj

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Criar banco de testes
        run: psql "$DATABASE_URL" -c "CREATE DATABASE veldocs_test"

      - name: Testes de integração
        run: pnpm test:integration

      - name: Migrações do banco da aplicação
        run: pnpm db:deploy

      - name: Build
        run: pnpm build

      - name: Instalar Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Testes E2E (servidor de produção)
        run: pnpm test:e2e
