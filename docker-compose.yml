# Infraestrutura LOCAL de desenvolvimento do VELDOCS.
# Não usar em staging/produção. Credenciais aqui são apenas para uso local.
name: veldocs

services:
  postgres:
    image: postgres:17-alpine
    container_name: veldocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veldocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veldocs_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-veldocs_dev}
    ports:
      # Exposto apenas em loopback.
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - veldocs-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Storage S3 compatível para desenvolvimento local e testes (FASE 5). Em
  # produção o storage é o Railway Storage Buckets. Versão fixa: a mesma do CI.
  # O MinIO parou de publicar no Docker Hub; o registry oficial é o quay.io.
  storage:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: veldocs-storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-veldocs}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-veldocs_storage_dev_only}
    ports:
      # Exposto apenas em loopback: API em 9010 e console em 9011.
      - "127.0.0.1:9010:9000"
      - "127.0.0.1:9011:9001"
    volumes:
      - veldocs-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Cria os buckets de desenvolvimento e de testes e termina.
  storage-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: veldocs-storage-init
    depends_on:
      storage:
        condition: service_healthy
    entrypoint: >-
      sh -c "mc alias set local http://storage:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}
      && mc mb --ignore-existing local/$${DEV_BUCKET}
      && mc mb --ignore-existing local/$${TEST_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-veldocs}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-veldocs_storage_dev_only}
      DEV_BUCKET: ${STORAGE_BUCKET:-veldocs-dev}
      TEST_BUCKET: ${TEST_STORAGE_BUCKET:-veldocs-test}
    restart: "no"

  # Aplicação em modo desenvolvimento (recarga automática).
  #
  # O código NÃO é montado do host: em Windows o watcher do Turbopack não
  # recebe os eventos de alteração através do bind mount e a página nunca
  # recarrega. O código vai na imagem e `pnpm docker:dev` (docker compose
  # watch) copia para o container o que mudar no host.
  app:
    build:
      context: .
      # Fora da raiz de propósito: o Railway detecta um Dockerfile na raiz e
      # passa a construir por ele em vez do nixpacks, quebrando o deploy.
      dockerfile: docker/Dockerfile
      target: dev
    container_name: veldocs-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    env_file: .env
    environment:
      # Dentro da rede do compose o banco é o serviço `postgres`, não o loopback.
      DATABASE_URL: postgresql://${POSTGRES_USER:-veldocs}:${POSTGRES_PASSWORD:-veldocs_dev_only}@postgres:5432/${POSTGRES_DB:-veldocs_dev}
      APP_URL: http://localhost:3000
      APP_ENV: development
      # O servidor fala com o storage pela rede do compose; o navegador, pelo loopback.
      STORAGE_ENDPOINT: http://storage:9000
      STORAGE_PUBLIC_ENDPOINT: http://127.0.0.1:9010
    ports:
      - "127.0.0.1:3000:3000"
    develop:
      watch:
        # Código da aplicação: copiado para o container e servidor reiniciado.
        # Só copiar não basta — escritas feitas de fora no sistema de arquivos
        # do container não geram eventos de inotify para o processo de dentro,
        # então o Turbopack não recompilaria (o dev server sobe em ~0,5 s).
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        # Mudanças que exigem instalar dependências ou regerar o client do
        # Prisma não podem ser só copiadas: a imagem é reconstruída.
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./next.config.ts
        - action: rebuild
          path: ./tsconfig.json

volumes:
  veldocs-postgres-data:
  veldocs-storage-data:
