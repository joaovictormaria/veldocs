# Infraestrutura LOCAL de desenvolvimento do VELDOCS.
# Não usar em staging/produção. Credenciais aqui são apenas para uso local.
name: veldocs

services:
  postgres:
    image: postgres:17-alpine
    container_name: veldocs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veldocs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veldocs_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-veldocs_dev}
    ports:
      # Exposto apenas em loopback.
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - veldocs-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Aplicação em modo desenvolvimento (recarga automática).
  #
  # O código NÃO é montado do host: em Windows o watcher do Turbopack não
  # recebe os eventos de alteração através do bind mount e a página nunca
  # recarrega. O código vai na imagem e `pnpm docker:dev` (docker compose
  # watch) copia para o container o que mudar no host.
  app:
    build:
      context: .
      target: dev
    container_name: veldocs-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      # Dentro da rede do compose o banco é o serviço `postgres`, não o loopback.
      DATABASE_URL: postgresql://${POSTGRES_USER:-veldocs}:${POSTGRES_PASSWORD:-veldocs_dev_only}@postgres:5432/${POSTGRES_DB:-veldocs_dev}
      APP_URL: http://localhost:3000
      APP_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    develop:
      watch:
        # Código da aplicação: copiado para o container e servidor reiniciado.
        # Só copiar não basta — escritas feitas de fora no sistema de arquivos
        # do container não geram eventos de inotify para o processo de dentro,
        # então o Turbopack não recompilaria (o dev server sobe em ~0,5 s).
        - action: sync
          path: ./src
          target: /app/src
        - action: sync
          path: ./public
          target: /app/public
        # Mudanças que exigem instalar dependências ou regerar o client do
        # Prisma não podem ser só copiadas: a imagem é reconstruída.
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: rebuild
          path: ./prisma
        - action: rebuild
          path: ./next.config.ts
        - action: rebuild
          path: ./tsconfig.json

volumes:
  veldocs-postgres-data:
